# RAG-Bench experiment sweep definition.
# 3 chunking strategies x 4 top-k depths = 12 configurations.
# Adding a new chunking strategy or top-k value here is enough to extend the sweep -
# no code changes needed in the runner.

corpus:
  path: "sample_data/financebench_synthetic.json"
  # Swap this to the real FinanceBench path once you've downloaded it.
  # See README "Swapping in real FinanceBench" section.

chunking_strategies:
  - name: fixed_size
    params:
      chunk_size: 500
      chunk_overlap: 50

  - name: recursive
    params:
      chunk_size: 500
      chunk_overlap: 50

  - name: sentence_window
    params:
      window_size: 3       # sentences per chunk
      stride: 2             # sentence stride between windows

retrieval_depths: [1, 3, 5, 10]   # top-k values

generation:
  # Model name is read from LLM_MODEL in .env so provider switching happens
  # in one place. This value is only a fallback if LLM_MODEL isn't set.
  model: "gemini-2.5-flash"
  max_tokens: 500
  temperature: 0.0
  system_prompt: >
    You are a financial analyst assistant. Answer the question using ONLY the
    provided context. If the context does not contain enough information to
    answer confidently, say so explicitly rather than guessing. Keep answers
    concise and cite specific figures from the context where relevant.

judge:
  # Same model as generation by default (overridden by LLM_MODEL in .env).
  # Using one model as both author and judge is a known bias risk - a model
  # tends to rate its own phrasing generously. Flagged in the README.
  model: "gemini-2.5-flash"
  max_tokens: 200
  temperature: 0.0

embedding:
  model: "all-MiniLM-L6-v2"   # runs locally via sentence-transformers, no API cost

# MODELED cost only. The sweep runs on a free tier, so no real money is spent.
# Token counts are real; these rates convert them into a dollar figure so the
# quality-vs-cost tradeoff is expressed in units people actually budget in.
# Default below is Claude Haiku 4.5 ($1/$5 per 1M tokens) as a stand-in for
# "what this would cost in production." Check current rates before citing.
pricing:
  input_per_million: 1.00
  output_per_million: 5.00

output:
  results_dir: "results"
